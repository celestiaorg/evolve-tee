[workspace]
members = ["app", "light-client"]

[workspace.dependencies]
ev-zkevm-types = { git = "https://github.com/celestiaorg/celestia-zkevm/", branch = "jonas/celestia-root-verification" }
tendermint-light-client-verifier = { version = "0.40.1", default-features = false, features = [
    "rust-crypto",
] }
dstack-sdk = { git = "https://github.com/Dstack-TEE/dstack.git" }
dstack-verifier = { git = "https://github.com/jonas089/dstack" }
dstack-types = { git = "https://github.com/jonas089/dstack" }
tokio = { version = "1.48.0", features = ["full"] }
axum = "0.8"
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.10.8"
hex = "0.4"
